name: Hermes native repair acceptance
permissions:
  contents: read
jobs:
  native:
    name: ${{ matrix.label }} (${{ matrix.phase }})
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
        - label: pr50030
          phase: fixed
          commit: a20cbda03135fd31e958be0be87b905cf4d41ac2
          tree: 4e277a34d027875cfa23d9124f6c3181d2100ee4
          test_path: tests/tools/live_recall/test_native_scope_queries.py
          extras: '["messaging"]'
    steps:
    - name: Checkout the exact candidate
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ matrix.commit }}
        fetch-depth: 2
        persist-credentials: false
    - name: Verify source identity
      shell: pwsh
      env:
        EXPECTED_COMMIT: ${{ matrix.commit }}
        EXPECTED_TREE: ${{ matrix.tree }}
      run: '$ErrorActionPreference = ''Stop''

        if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED_COMMIT) { throw ''Candidate
        commit mismatch'' }

        if ((git rev-parse ''HEAD^{tree}'').Trim() -ne $env:EXPECTED_TREE) { throw
        ''Candidate tree mismatch'' }

        git fetch --no-tags --depth=1 origin ddabd3837862022a6053331fe3ba97cf9716b9e3

        if ($LASTEXITCODE) { exit $LASTEXITCODE }

        New-Item -ItemType Directory -Force artifacts/hermes-repair-20261019/ci-acceptance
        | Out-Null

        @{ commit=$env:EXPECTED_COMMIT; tree=$env:EXPECTED_TREE; os=[System.Environment]::OSVersion.VersionString
        } | ConvertTo-Json | Set-Content -Encoding utf8 artifacts/hermes-repair-20261019/ci-acceptance/source.json

        '
    - name: Build the locked native test environment
      id: pm
      uses: ./.github/actions/setup-pm
      with:
        extras: ${{ matrix.extras }}
        test-environment: 'true'
        cache-suffix: hermes-repair-20261019
    - name: Prepare the actual checkpoint tool store
      if: contains(matrix.test_path, 'live_checkpoints')
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        $env:HERMES_RUNTIME_DIR = Join-Path $env:RUNNER_TEMP ''repair-acceptance/pm-runtime''

        $env:HERMES_HOME = Join-Path $env:RUNNER_TEMP ''repair-acceptance/pm-home''

        New-Item -ItemType Directory -Force $env:HERMES_HOME | Out-Null

        & $env:HERMES_PYTHON -c "import pm; pm.ensure(''git'', explicit=True)"

        if ($LASTEXITCODE) { exit $LASTEXITCODE }

        '
    - name: Run real native behavior checks
      id: behavior
      shell: pwsh
      env:
        TEST_PATH: ${{ matrix.test_path }}
        CASE_LABEL: ${{ matrix.label }}
        CASE_PHASE: ${{ matrix.phase }}
        EXPECTED_COMMIT: ${{ matrix.commit }}
        EXPECTED_TREE: ${{ matrix.tree }}
      run: "$ErrorActionPreference = 'Stop'\n$bash = Join-Path $env:ProgramFiles 'Git/bin/bash.exe'\n\
        $receipt = 'artifacts/hermes-repair-20261019/ci-acceptance/junit.xml'\n$cases\
        \ = (Join-Path $env:RUNNER_TEMP 'repair-acceptance/cases').Replace('\\', '/')\n\
        & $bash scripts/run_tests.sh $env:TEST_PATH --file-timeout 300 -- --noconftest\
        \ --basetemp=$cases --junitxml=$receipt -q\n$testExit = $LASTEXITCODE\n[xml]$junit\
        \ = [IO.File]::ReadAllText((Join-Path (Get-Location) $receipt))\n$counts =\
        \ [ordered]@{ tests=0; failures=0; errors=0; skipped=0 }\nforeach ($suite\
        \ in $junit.SelectNodes('//testsuite')) {\n  foreach ($name in @('tests','failures','errors','skipped'))\
        \ { $counts[$name] += [int]$suite.GetAttribute($name) }\n}\n$record = [ordered]@{\
        \ label=$env:CASE_LABEL; phase=$env:CASE_PHASE; commit=$env:EXPECTED_COMMIT;\
        \ tree=$env:EXPECTED_TREE; actual_test_exit=$testExit; junit=$counts; test_file_sha256=(Get-FileHash\
        \ $env:TEST_PATH -Algorithm SHA256).Hash.ToLowerInvariant(); real_host=$env:RUNNER_OS;\
        \ python=$env:HERMES_PYTHON }\n$record | ConvertTo-Json -Depth 5 | Set-Content\
        \ -Encoding utf8 artifacts/hermes-repair-20261019/ci-acceptance/behavior.json\n\
        if ($testExit -eq 0 -and ($counts.tests -ne 6 -or $counts.failures -ne 0 -or\
        \ $counts.errors -ne 0 -or $counts.skipped -ne 0)) { throw 'Expected six passing\
        \ real tests without skips' }\nexit $testExit\n"
    - name: Run the complete repository lint checks
      if: ${{ !cancelled() && matrix.phase == 'fixed' && steps.pm.outcome == 'success'
        }}
      shell: pwsh
      env:
        EXPECTED_COMMIT: ${{ matrix.commit }}
      run: '& $env:HERMES_PYTHON scripts/check --base ddabd3837862022a6053331fe3ba97cf9716b9e3
        --commit $env:EXPECTED_COMMIT

        exit $LASTEXITCODE

        '
    - name: Save actual acceptance receipts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: repair-${{ matrix.label }}-${{ matrix.phase }}
        path: artifacts/hermes-repair-20261019/ci-acceptance/
        if-no-files-found: error
        retention-days: 7
'on':
  push:
    branches:
    - health-repair/native-validation-20261019
  pull_request:
    branches:
    - main
    paths:
    - .github/workflows/repair-native-acceptance.yml
run-name: Verify restored fork Actions with six real SQLite recall tests
defaults:
  run:
    shell: pwsh
concurrency:
  group: repair-native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
